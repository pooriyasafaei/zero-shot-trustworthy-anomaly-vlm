# The VLM branch at a size that fits one Kaggle session.
#
# Qwen is ~2 orders of magnitude slower than cached CLIP embeddings, so both the
# test subset and the conformal calibration pool are capped. Both caps are recorded
# in `subset_tag`, so these numbers can never be silently pooled with full-set ones.
defaults: [base.yaml]

paths:
  run_name: qwen_subset

data:
  categories: [bottle, carpet, hazelnut, pill, screw]
  subset: n_per_folder=5
  cal_subset: n_per_folder=40           # 40 normal images per category for conformal

qwen:
  model_id: Qwen/Qwen2.5-VL-3B-Instruct
  mode: both                            # greedy logprob score + samples for entropy
  n_samples: 5
  max_new_tokens: 140
  prompt_variants: [terse, blurred]

conformal:
  delta: 0.10                           # 40 calibration images cannot certify delta=0.01
  deltas: [0.05, 0.10, 0.20]
  n_cal_sweep: [10, 20, 40, null]

uncertainty:
  estimators: [token_entropy, verdict_var, verbalized_conf, semantic_entropy, prompt_perturb, abstention]

eval:
  n_boot: 1000
