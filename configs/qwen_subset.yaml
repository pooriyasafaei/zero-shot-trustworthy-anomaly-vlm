# The VLM branch at a size that fits one Kaggle session.
#
# Qwen is ~2 orders of magnitude slower than cached CLIP embeddings, so both the
# test subset and the conformal calibration pool are capped. Both caps are recorded
# in `subset_tag`, so these numbers can never be silently pooled with full-set ones.
defaults: [base.yaml]

paths:
  run_name: qwen_subset

data:
  categories: [bottle, carpet, hazelnut, pill, screw]
  subset: n_per_folder=5
  # Calibration pool per category. 100 is the floor wherever throughput allows:
  # the calibration-draw sd is 0.033 at n=40 vs 0.021 at n=100 (delta=0.05), and
  # at n=40 a delta of 0.01 is *uncertifiable* -- ceil((n+1)(1-delta)) = 41 > 40,
  # so conformal_quantile returns +inf by design. An inf threshold in the output
  # is correct behaviour, not a bug: it means "this calibration set is too small
  # to certify that level".
  cal_subset: n_per_folder=100

qwen:
  model_id: Qwen/Qwen2.5-VL-3B-Instruct
  mode: both                            # greedy logprob score + samples for entropy
  n_samples: 5
  max_new_tokens: 140
  prompt_variants: [terse, blurred]

conformal:
  delta: 0.10
  deltas: [0.05, 0.10, 0.20]            # 0.01 needs n_cal >= 99; see cal_subset above
  n_cal_sweep: [25, 50, 100, null]

uncertainty:
  estimators: [token_entropy, verdict_var, verbalized_conf, semantic_entropy, prompt_perturb, abstention]

eval:
  n_boot: 1000
